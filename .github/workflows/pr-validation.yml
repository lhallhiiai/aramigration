name: PR Validation

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend (build + format + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ARA.slnx

      - name: Build (Release)
        run: dotnet build ARA.slnx -c Release --no-restore

      - name: Format check
        run: dotnet format ARA.slnx --verify-no-changes --no-restore

      - name: Test (with coverage)
        # ARA_TEST_CONNECTION_STRING is intentionally unset in CI — Infrastructure
        # tests use the IsAvailable pattern in TestDatabaseFixture and skip
        # gracefully when no DB is reachable. Item 7 carry-forward note tracks the
        # follow-up to wire a CI-accessible Azure SQL test target.
        run: >-
          dotnet test ARA.slnx -c Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Merge coverage reports
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator "-reports:TestResults/*/coverage.cobertura.xml" "-targetdir:CoverageReport" "-reporttypes:Cobertura;TextSummary"
          cat CoverageReport/Summary.txt

      - name: Coverage threshold gate
        # Threshold is intentionally set to the dev-branch achievable bar
        # (≥35% line). The aspirational ≥80% lives in SHIP_PLAN Item 7
        # acceptance and lifts when the phase2 AraService merge + Azure SQL
        # CI target close the documented gaps.
        shell: pwsh
        run: ../../scripts/Test-CoverageThreshold.ps1 -Path CoverageReport/Cobertura.xml -MinimumLineRate 0.35

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: new/backend/CoverageReport/Cobertura.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new/frontend
    env:
      # Build-time placeholders so the bundler can substitute import.meta.env.
      # These are not real credentials — production builds inject the real
      # values via Docker build args (see new/frontend/Dockerfile).
      VITE_OKTA_ISSUER: https://example.com/oauth2/default
      VITE_OKTA_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: new/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (with coverage)
        # vitest.config.ts enforces ≥70% line/branch/function/statement
        # thresholds on the included src/lib/** modules. A drop fails the job.
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: new/frontend/coverage/lcov.info
          if-no-files-found: warn

  commitlint:
    name: Commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run commitlint
        uses: wagoid/commitlint-github-action@v6
